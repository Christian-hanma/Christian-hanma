      <rect x="77" y="160" width="18" height="58" rx="2" fill="#1fb6a6" opacity="0.8" />
      
      <rect x="115" y="110" width="22" height="110" rx="3" fill="#161b22" stroke="#7ee787" stroke-width="1.2" />
      <rect x="117" y="130" width="18" height="88" rx="2" fill="#7ee787" opacity="0.8" />

      <rect x="155" y="150" width="22" height="70" rx="3" fill="#161b22" stroke="#ffa657" stroke-width="1.2" />
      <rect x="157" y="175" width="18" height="43" rx="2" fill="#ffa657" opacity="0.8" />

      <rect x="195" y="90" width="22" height="130" rx="3" fill="#161b22" stroke="#a5d6ff" stroke-width="1.2" />
      <rect x="197" y="105" width="18" height="113" rx="2" fill="#a5d6ff" opacity="0.8" />

      <rect x="235" y="120" width="22" height="100" rx="3" fill="#161b22" stroke="#d2a8ff" stroke-width="1.2" />
      <rect x="237" y="140" width="18" height="78" rx="2" fill="#d2a8ff" opacity="0.8" />

      <line x1="60" y1="222" x2="265" y2="222" stroke="#484f58" stroke-width="1.5" />
      <path d="M 75 150 L 115 120 L 155 165 L 195 95 L 235 130" fill="none" stroke="#7ee787" stroke-width="2" filter="url(#glow)" />
      
      <text x="160" y="265" text-anchor="middle" class="font-mono" fill="#7ee787" font-size="12" font-weight="600">FINANCIAL DASHBOARD</text>
      <text x="160" y="285" text-anchor="middle" class="font-mono text-muted" font-size="10">PDT 621 · RATIOS · BALANCES</text>
    </g>

    <!-- SLIDE 3: PYTHON & AUTOMATION HEXAGON -->
    <g class="slide-3">
      <polygon points="160,110 220,145 220,215 160,250 100,215 100,145" fill="#161b22" stroke="#1fb6a6" stroke-width="2" filter="url(#glow)" />
      <path d="M160,135 L190,152 L190,188 L160,205 L130,188 L130,152 Z" fill="none" stroke="#ffa657" stroke-width="1.5" />
      <circle cx="150" cy="160" r="5" fill="#a5d6ff" />
      <circle cx="170" cy="180" r="5" fill="#ffa657" />

      <text x="160" y="285" text-anchor="middle" class="font-mono" fill="#ffa657" font-size="12" font-weight="600">PYTHON AUTOMATION</text>
      <text x="160" y="303" text-anchor="middle" class="font-mono text-muted" font-size="10">ETL · SCRIPTS · TKINTER</text>
    </g>

    <!-- SLIDE 4: TECH & DEVELOPMENT ENGINE -->
    <g class="slide-4">
      <circle cx="160" cy="175" r="55" fill="none" stroke="#30363d" stroke-width="2" />
      <circle cx="160" cy="175" r="55" fill="none" stroke="#1fb6a6" stroke-width="2.5" stroke-dasharray="80 120" />
      <text x="160" y="184" text-anchor="middle" class="font-mono" fill="#1fb6a6" font-size="24" font-weight="800">&lt; / &gt;</text>

      <text x="160" y="275" text-anchor="middle" class="font-mono" fill="#a5d6ff" font-size="12" font-weight="600">TECH &amp; DEVELOPMENT</text>
      <text x="160" y="295" text-anchor="middle" class="font-mono text-muted" font-size="10">GIT · SQL · NEXT.JS</text>
    </g>

    <!-- Footer of Left Pane -->
    <text x="16" y="352" class="font-mono text-muted" font-size="10">STATUS: RUNNING</text>
    <circle cx="295" cy="348" r="4" fill="#1fb6a6" class="cursor" />
  </g>

  <!-- RIGHT PANE: profile.yml [YAML] -->
  <g transform="translate(360, 52)">
    <rect width="580" height="366" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />

    <!-- Pane Header -->
    <text x="16" y="24" class="font-mono" fill="#a5d6ff" font-size="12" font-weight="700">profile.yml <tspan fill="#484f58">[YAML]</tspan></text>
    <rect x="490" y="10" width="75" height="18" rx="4" fill="#21262d" />
    <text x="527" y="23" text-anchor="middle" class="font-mono text-muted" font-size="10">@christian</text>
    <line x1="16" y1="34" x2="564" y2="34" stroke="#21262d" stroke-width="1" />

