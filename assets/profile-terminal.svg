<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Christian Farias — Profile Shell</title>
  <desc id="desc">Terminal interactivo con la información del perfil y stack de Christian Farias.</desc>
  
  <style>
    .key { fill: #1fb6a6; font-weight: 600; }
    .val { fill: #a5d6ff; }
    .val-highlight { fill: #7ee787; font-weight: 600; }
    .val-orange { fill: #ffa657; }
    .num { fill: #484f58; }
    .text-muted { fill: #8b949e; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }

    /* Animation for Visual Map cycling */
    @keyframes slideCycle1 {
      0%, 22% { opacity: 1; transform: scale(1); }
      25%, 97% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideCycle2 {
      0%, 22% { opacity: 0; transform: scale(0.95); }
      25%, 47% { opacity: 1; transform: scale(1); }
      50%, 100% { opacity: 0; transform: scale(0.95); }
    }
    @keyframes slideCycle3 {
      0%, 47% { opacity: 0; transform: scale(0.95); }
      50%, 72% { opacity: 1; transform: scale(1); }
      75%, 100% { opacity: 0; transform: scale(0.95); }
    }
    @keyframes slideCycle4 {
      0%, 72% { opacity: 0; transform: scale(0.95); }
      75%, 97% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }

    .slide-1 { animation: slideCycle1 16s infinite ease-in-out; transform-origin: 180px 220px; }
    .slide-2 { animation: slideCycle2 16s infinite ease-in-out; transform-origin: 180px 220px; }
    .slide-3 { animation: slideCycle3 16s infinite ease-in-out; transform-origin: 180px 220px; }
    .slide-4 { animation: slideCycle4 16s infinite ease-in-out; transform-origin: 180px 220px; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .glow-border { animation: pulseGlow 4s infinite ease-in-out; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1s infinite; fill: #1fb6a6; }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Window Container -->
  <rect width="960" height="440" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M0 14C0 6.26801 6.26801 0 14 0H946C953.732 0 960 6.26801 960 14V38H0V14Z" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Mac Window Control Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56" />
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="19" r="6" fill="#27c93f" />

  <!-- Header Title -->
  <text x="480" y="24" text-anchor="middle" class="font-mono text-muted" font-size="13">vim profile.yml</text>
  
  <!-- Badge @christian-hanma -->
  <rect x="830" y="10" width="110" height="18" rx="9" fill="#21262d" stroke="#30363d" />
  <text x="885" y="23" text-anchor="middle" class="font-mono text-muted" font-size="11">@christian-hanma</text>

  <!-- MAIN CONTENT AREA -->

  <!-- LEFT PANE: VISUAL.MAP -->
  <g transform="translate(20, 52)">
