      <text x="135" y="38" class="val">Contabilidad &amp; Data Analytics</text>

      <text x="0" y="57" class="num"> 4</text>
      <text x="48" y="57" class="key">origin:</text>
      <text x="135" y="57" class="val">Tumbes, Perú 🇵🇪</text>

      <text x="0" y="76" class="num"> 5</text>
      <text x="48" y="76" class="key">focus:</text>
      <text x="135" y="76" class="val">Financial Data · BI · Automation</text>

      <text x="0" y="95" class="num"> 6</text>
      <text x="48" y="95" class="key">status:</text>
