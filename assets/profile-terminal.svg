      <text x="40" y="16" text-anchor="middle" class="font-mono" fill="#0d1117" font-size="10" font-weight="800">NORMAL</text>
      <text x="80" y="16" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="600">profile.yml</text>
