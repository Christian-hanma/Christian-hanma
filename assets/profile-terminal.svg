    <!-- SLIDE 1: DATA ANALYTICS / SQL NODES -->
    <g class="slide-1">
      <circle cx="160" cy="180" r="70" fill="none" stroke="#1fb6a6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
      <circle cx="160" cy="180" r="45" fill="none" stroke="#a5d6ff" stroke-width="1" opacity="0.4" />
      <circle cx="160" cy="180" r="14" fill="#1fb6a6" filter="url(#glow)" />
      <text x="160" y="184" text-anchor="middle" class="font-mono" fill="#0d1117" font-size="10" font-weight="800">DATA</text>
      
      <line x1="160" y1="180" x2="110" y2="130" stroke="#1fb6a6" stroke-width="1.2" opacity="0.7" />
      <circle cx="110" cy="130" r="18" fill="#161b22" stroke="#1fb6a6" stroke-width="1.5" />
      <text x="110" y="134" text-anchor="middle" class="font-mono" fill="#a5d6ff" font-size="9" font-weight="700">SQL</text>

      <line x1="160" y1="180" x2="210" y2="130" stroke="#1fb6a6" stroke-width="1.2" opacity="0.7" />
      <circle cx="210" cy="130" r="18" fill="#161b22" stroke="#7ee787" stroke-width="1.5" />
      <text x="210" y="134" text-anchor="middle" class="font-mono" fill="#7ee787" font-size="9" font-weight="700">PBI</text>

      <line x1="160" y1="180" x2="110" y2="230" stroke="#1fb6a6" stroke-width="1.2" opacity="0.7" />
      <circle cx="110" cy="230" r="18" fill="#161b22" stroke="#ffa657" stroke-width="1.5" />
      <text x="110" y="234" text-anchor="middle" class="font-mono" fill="#ffa657" font-size="8" font-weight="700">PY</text>

      <line x1="160" y1="180" x2="210" y2="230" stroke="#1fb6a6" stroke-width="1.2" opacity="0.7" />
      <circle cx="210" cy="230" r="18" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5" />
