    <!-- Pane Header -->
    <text x="16" y="24" class="font-mono" fill="#1fb6a6" font-size="11" font-weight="700" letter-spacing="1">VISUAL.MAP</text>
    <text x="304" y="24" text-anchor="end" class="font-mono text-muted" font-size="10">300x340 / DATA-BIT</text>
    <line x1="16" y1="34" x2="304" y2="34" stroke="#21262d" stroke-width="1" />

    <!-- Outer Frame Corner Indicators -->
    <path d="M 24 50 L 34 50 L 34 60" fill="none" stroke="#484f58" stroke-width="1" />
    <path d="M 296 50 L 286 50 L 286 60" fill="none" stroke="#484f58" stroke-width="1" />
    <path d="M 24 340 L 34 340 L 34 330" fill="none" stroke="#484f58" stroke-width="1" />
    <path d="M 296 340 L 286 340 L 286 330" fill="none" stroke="#484f58" stroke-width="1" />

