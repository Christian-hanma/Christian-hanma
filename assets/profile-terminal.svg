      <text x="0" y="247" class="num">14</text>
      <text x="48" y="247" class="key">portfolio:</text>
      <text x="145" y="247" class="val-highlight">portafolio-tau-seven-89.vercel.app</text>

      <text x="0" y="266" class="num">15</text>
      <text x="48" y="266" class="key">linkedin:</text>
